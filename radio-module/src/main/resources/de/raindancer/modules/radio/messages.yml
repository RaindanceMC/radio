# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
radio:
  only-a-player: "<red>Only a player can listen to the radio."
  usage: "<gray>Use <white>/music</white>, or <white>/music station|skip|stop|on|volume|status</white>."
  off-here: "<gray>The radio is switched off on this server."
  tuned: "<gray>Tuned in to <white><station></white>. Only you hear it."
  no-tracks: "<gray><white><station></white> has no tracks yet. Try another station."
  no-pack: "<red>The radio needs the server's resource pack, which has the music in it."
  skipped: "<gray>Skipped. Next track coming up."
  nothing-to-skip: "<gray>Nothing is playing to skip."
  stopped: "<gray>Radio off. <white>/music on</white> brings it back."
  was-off: "<gray>The radio was already off."
  which-station: "<gray>Which station? <white><stations></white>"
  unknown-station: "<red>There is no station called <white><typed></white>. <gray>Try: <white><stations></white>"
  volume: "<gray>Radio volume: <white><volume>%</white>."
  volume-usage: "<gray>Radio volume is <white><volume>%</white>. Use <white>/music volume 5-100</white>."
  status-off: "<gray>The radio is off. Your station is <white><station></white>."
  status-waiting: "<gray>The radio is on <white><station></white> and starts in a moment."
  status-playing: "<gray>Playing <white><title></white> on <white><station></white> at <white><volume>%</white>."
  now-playing: "<#6EC1EA>♪ <white><title></white> <dark_gray>· <gray><station> <dark_gray>· <gray><length>"
